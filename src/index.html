<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. [Name] — Writer & Painter</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* drifting Arabic letters behind the name and portrait */
.stage{position:relative;overflow:clip}
.stage>.hero{position:relative;z-index:1}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
</style>
</head>
<body data-page="home" data-id="">
<main>
<div class="stage"><canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap hero">
 <div class="reveal"><div class="kicker" data-i18n="kick"></div><h1 data-i18n="name"></h1>
  <svg class="ink-line" viewBox="0 0 340 18" fill="none" aria-hidden="true"><path d="M2 12 C60 2, 110 16, 170 9 S290 4, 338 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  <p class="lede" data-i18n="lede"></p><a class="btn" href="books.html" data-i18n="cta"></a></div>
 <div class="prints" role="img" aria-label="Portrait placeholder"><div class="print b torn"><div class="ph"></div></div><div class="print torn"><div class="ph"><span data-i18n="ph"></span></div><div class="cap" data-i18n="cap"></div></div></div>
</div></div>
<section id="about" style="padding-top:1rem"><div class="wrap"><h2 data-i18n="h_about"></h2><p class="sub" data-i18n="s_about"></p>
 <div class="about"><div><p class="drop" data-i18n="a1"></p></div><div><p data-i18n="a2"></p></div></div></div></section>
<section id="books" style="padding-top:1rem"><div class="wrap"><h2 data-i18n="h_books"></h2><p class="sub" data-i18n="s_books"></p><div class="shelf" data-slot="books"></div><p class="more"><a class="btn ghost" href="books.html" data-i18n="all_books"></a></p></div></section>
<section id="paintings" class="paint"><div class="wrap"><h2 data-i18n="h_paint"></h2><p class="sub" data-i18n="s_paint2"></p><div class="gal" data-slot="paint"></div><p class="more"><a class="btn ghost" href="paintings.html" data-i18n="all_paint"></a></p></div></section>
<section><div class="wrap"><blockquote><span data-i18n="q"></span><cite data-i18n="qc"></cite></blockquote></div></section>
</main>
<script src="site.js"></script>
<script>
(function(){
 const st=document.querySelector('.stage'),c=document.getElementById('bg'),x=c.getContext('2d');
 const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const G='ا ب ت ث ج ح خ د ر س ش ص ع غ ف ق ك ل م ن ه و ي كلمة حبر قلم سطر ديوان'.split(' ');
 let W,H,P=[],m={x:-999,y:-999},raf=0,vis=true;
 function size(){
  const r=st.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),sm=r.width<800;
  W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.round(W*H/(sm?65000:48000));
  P=Array.from({length:n},()=>{const b=-.3-Math.random()*.55;
   return{t:G[Math.random()*G.length|0],x:Math.random()*W,y:Math.random()*H,s:(sm?18:22)+Math.random()*(sm?40:60),b,vx:0,vy:b,a:(sm?.04:.05)+Math.random()*(sm?.09:.12),r:(Math.random()-.5)*.6}});
  draw1();
 }
 function draw1(){
  x.clearRect(0,0,W,H);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#2a2118';
  for(const p of P){
   if(!RM){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy)||1;
    if(d<150){const f=(150-d)/150;p.vx+=dx/d*f*1.4;p.vy+=dy/d*f*1.4}
    p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy+=(p.b-p.vy)*.03;
    if(p.y<-100){p.y=H+60;p.x=Math.random()*W}}
   x.save();x.globalAlpha=p.a;x.translate(p.x,p.y);x.rotate(p.r);x.font=p.s+'px Amiri,serif';x.fillText(p.t,0,0);x.restore();
  }
 }
 function loop(){draw1();raf=vis&&!RM?requestAnimationFrame(loop):0}
 function start(){if(!raf&&!RM)raf=requestAnimationFrame(loop)}
 const aim=e=>{const r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top};
 addEventListener('pointermove',aim,{passive:true});addEventListener('pointerdown',aim,{passive:true});
 addEventListener('pointerup',()=>{m.x=m.y=-999});
 new ResizeObserver(size).observe(st);
 new IntersectionObserver(([e])=>{vis=e.isIntersecting;if(vis)start()}).observe(st);
 document.fonts.ready.then(()=>{size();start()});
})();
</script>
</body>
</html>
