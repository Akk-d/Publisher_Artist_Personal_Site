# Build the Eleventy site and publish _site/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a running deploy is allowed to finish before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Own domain: set repository variables SITE_ORIGIN (e.g. https://example.com) and PATH_PREFIX (/)
      # under Settings → Secrets and variables → Actions. Unset = the github.io address.
      - run: npm run build:pages
        env: { SITE_ORIGIN: "${{ vars.SITE_ORIGIN }}", PATH_PREFIX: "${{ vars.PATH_PREFIX }}" }
      - run: npm run check:pages
        env: { SITE_ORIGIN: "${{ vars.SITE_ORIGIN }}", PATH_PREFIX: "${{ vars.PATH_PREFIX }}" }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
